[pytest]
# Backend integration test configuration.
# All tests require the backend and Ollama to be running locally.

testpaths = tests
addopts = -v --tb=short

# Custom marks
markers =
    slow: Full LLM pipeline tests — takes 1–10 minutes. Skip with: pytest -m "not slow"
    vlm: Vision model tests — requires qwen3-vl:4b loaded. Skip with: pytest -m "not vlm"
    integration: Requires live backend at localhost:8000.

# Disable asyncio warnings from SQLAlchemy
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
